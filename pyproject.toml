[project]
name = "rep-compression"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "nvitop>=1.6.2",
    "pandas>=3.0.0",
    "pyaml-env>=1.2.2",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "timm>=1.0.26",
    "torch>=2.9.0",
    "torchattacks>=3.5.1",
    "torchvision>=0.24.0",
    "tqdm>=4.67.3",
    "utilz",
]

[tool.uv.sources]
utilz = {path = "./utilz", editable = true}
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
